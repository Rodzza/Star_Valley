# Gera um APK de TESTE (anúncios de teste, assinado com a chave de debug) na nuvem do GitHub.
# Roda sozinho a cada envio para a branch main (ou manualmente em Actions › Run workflow).
# O APK fica na aba Releases (release "teste"), pronto para baixar e instalar direto pelo celular.
name: APK de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_UNLOCK_ALL: 'true'
      - run: npx cap add android
      - run: npx tsx tools/configureAndroid.ts --test
      - run: npx cap sync android
      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ValleyTracker-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: valley-tracker-apk
          path: ValleyTracker-teste.apk
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --cleanup-tag --yes || true
          gh release create teste ValleyTracker-teste.apk \
            --title "Valley Tracker (teste)" \
            --notes "APK de teste com anúncios de teste do AdMob. Gerado do commit ${GITHUB_SHA::7}. Baixe ValleyTracker-teste.apk e instale." \
            --prerelease
