# Configuração da análise do SonarQube (ci/sonarqube.sh roda em todo pull request).
sonar.projectName=Valley Notes
sonar.sources=src,tools
sonar.exclusions=**/node_modules/**,**/dist/**,src/data/**/*.json,src/assets/**,**/*.test.ts,**/*.test.tsx,**/*.java
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8
